[project]
name = "cageops-common"
version = "0.1.0"
description = "Shared code for CageOps services: config, db models, logging, metrics"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings",
    "sqlalchemy>=2.1.2",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
