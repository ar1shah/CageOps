[project]
name = "cageops-common"
version = "0.1.0"
description = "Shared code for CageOps services: config, db models, logging, metrics"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings",
    "sqlalchemy>=2.1.2",
    # zoneinfo needs the IANA database; slim container images may not ship one (D-037).
    "tzdata",
]

[project.optional-dependencies]
# What predicting needs (`cageops_common.inference`, except `asof`, which is stdlib only).
# The API and the trainer depend on `cageops-common[inference]`; the scraper and the worker do not,
# so their images never carry LightGBM or libgomp.
inference = [
    "lightgbm>=4.7.0",
    "numpy>=2.5.4",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
