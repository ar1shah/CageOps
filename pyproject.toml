# Workspace root. This is a "virtual" workspace: the root itself is not a package,
# it just lists the members and holds shared tooling config.
[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
cageops-common = { workspace = true }

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["packages", "services"]
addopts = "--import-mode=importlib"
