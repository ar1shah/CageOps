# Workspace root. This is a "virtual" workspace: the root itself is not a package,
# it just lists the members and holds shared tooling config.
[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
cageops-common = { workspace = true }

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# Workspace packages live under src/, so tell ruff they are first-party.
known-first-party = [
    "cageops_common",
    "cageops_api",
    "cageops_scraper",
    "cageops_worker",
    "cageops_trainer",
]

[tool.pytest.ini_options]
testpaths = ["packages", "services", "scripts"]
pythonpath = ["scripts"]
addopts = "--import-mode=importlib"
