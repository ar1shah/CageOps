[project]
name = "cageops-api"
version = "0.1.0"
description = "FastAPI prediction + writeup service"
requires-python = ">=3.12"
dependencies = ["cageops-common", "fastapi", "uvicorn[standard]"]

[dependency-groups]
dev = ["httpx"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
