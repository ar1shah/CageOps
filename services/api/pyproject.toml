[project]
name = "cageops-api"
version = "0.1.0"
description = "FastAPI prediction + writeup service"
requires-python = ">=3.12"
dependencies = [
    "cageops-common[inference]",
    "fastapi",
    "prometheus-client>=0.26.0",
    "uvicorn[standard]",
]

[dependency-groups]
# Starlette 1.x's TestClient prefers httpx2 and warns when it only finds httpx.
dev = ["httpx2"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
