[project]
name = "cageops-scraper"
version = "0.1.0"
description = "ufcstats + news fetchers and parsers"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "cageops-common",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "prometheus-client>=0.26.0",
    "redis>=8.1.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
