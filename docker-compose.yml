# Local dev infrastructure: Postgres 16 + pgvector, and Redis 7.
# Credentials come from .env (see .env.example). Compose refuses to start if they're missing.
#
# The API is behind a profile, so `docker compose up -d` stays "Postgres and Redis" and the image
# is only built when asked for:
#
#   docker compose --profile api up -d --build api
#
# It serves what `uv run python -m cageops_trainer activate` activated, read from ./data/models
# (mounted read-only: a model is data with its own lifecycle, not part of the image).
services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:5432:5432" # localhost only, not exposed to the network
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4.6-alpine
    command: ["redis-server", "--appendonly", "yes"] # persist to disk so data survives restarts
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    profiles: ["api"]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    image: cageops-api:local
    environment:
      # Inside the compose network the services are `postgres` and `redis`, not localhost.
      # API_DATABASE_URL points the API at another database (the load test uses cageops_loadtest).
      DATABASE_URL: ${API_DATABASE_URL:-postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}}
      REDIS_URL: redis://redis:6379/0
      MODEL_ARTIFACT_DIR: /models
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/New_York}
      MODEL_POLL_INTERVAL_S: ${MODEL_POLL_INTERVAL_S:-30}
      MODEL_RELOAD_RETRY_S: ${MODEL_RELOAD_RETRY_S:-300}
      PREDICT_TOP_FEATURES: ${PREDICT_TOP_FEATURES:-5}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL_S: ${CACHE_TTL_S:-21600}
      REDIS_TIMEOUT_MS: ${REDIS_TIMEOUT_MS:-100}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-40}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      FRONTEND_API_KEY: ${FRONTEND_API_KEY:-}
      FRONTEND_API_KEY_PREVIOUS: ${FRONTEND_API_KEY_PREVIOUS:-}
      FRONTEND_USER_RATE_PER_MINUTE: ${FRONTEND_USER_RATE_PER_MINUTE:-300}
      FRONTEND_USER_BURST: ${FRONTEND_USER_BURST:-100}
      FRONTEND_KEY_RATE_PER_MINUTE: ${FRONTEND_KEY_RATE_PER_MINUTE:-6000}
      FRONTEND_KEY_BURST: ${FRONTEND_KEY_BURST:-600}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      DB_POOL_TIMEOUT_S: ${DB_POOL_TIMEOUT_S:-30}
    volumes:
      - ./data/models:/models:ro
    ports:
      - "127.0.0.1:8000:8000" # localhost only; a reverse proxy fronts it in 2c
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
