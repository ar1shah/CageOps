name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    # Real Postgres for the integration tests (D-012). Same image as docker-compose.yml.
    # Throwaway container inside the job, so trust auth is fine and there is no password.
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_USER: cageops
          POSTGRES_DB: cageops
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cageops -d cageops"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Real Redis for the rate limiter and circuit breaker tests: their correctness depends on
      # Redis running a script atomically. Same image tag as docker-compose.yml.
      redis:
        image: redis:7.4.6-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://cageops@localhost:5432/cageops
      REDIS_URL: redis://localhost:6379/0
      # An unreachable database must fail the build, not silently skip the DB tests.
      REQUIRE_DB: "1"
      REQUIRE_REDIS: "1"
    steps:
      # Actions are pinned to commit SHAs (tag in the comment): tags can be moved, SHAs can't.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same uv version as local dev so lockfile behavior matches.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          enable-cache: true

      - name: Install dependencies (fails if uv.lock is stale)
        run: uv sync --locked --all-packages --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

      # Validates the compose file and variable interpolation using placeholder values.
      # Does not pull images or start containers.
      - name: Validate docker-compose.yml
        run: docker compose --env-file .env.example config --quiet
